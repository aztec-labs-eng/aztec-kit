name: Deploy to Vercel

# ─────────────────────────────────────────────────────────────────────────────
# Two-project Vercel model
# ─────────────────────────────────────────────────────────────────────────────
# Each app has TWO Vercel projects, one per long-lived branch:
#   - `aztec-kit-<app>`      → production = main, preview = PRs against main
#   - `aztec-kit-<app>-next` → production = next, preview = PRs against next
#
# Per-app project IDs are stored as repo secrets:
#   BRIDGE_PROJECT_ID  / BRIDGE_PROJECT_ID_NEXT
#   FPC_PROJECT_ID     / FPC_PROJECT_ID_NEXT
#   SWAP_PROJECT_ID    / SWAP_PROJECT_ID_NEXT
#
# Production domains (next.<app>.aztec-labs.com) are configured on the *-next
# Vercel projects, so prod-slot deploys auto-alias — no manual `vercel alias
# set` step.
#
# SOURCE OF TRUTH = the DEFAULT branch (main). `pull_request_target` executes
# the workflow file from the default branch regardless of the PR's base, so this
# file (and the setup action it calls) must be replicated to the long-lived
# branches but the version that actually runs for previews is main's. The setup
# action is branch-aware: a PR head on the private channel (v5-next) triggers the
# private toolchain flow; public heads use install.aztec.network. v5-next routes
# to the *-next project's PREVIEW slot only (never the next.* production domain).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - next
  # On PRs, deploy preview after CI passes. pull_request_target runs in the
  # context of the base repo so it has access to secrets (needed for Vercel
  # deploys + PR comments) — we wait for the CI workflow on the PR head to
  # finish successfully before building.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production (false → preview deploy on the dispatch ref's project)"
        required: false
        default: true
        type: boolean

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  authorize:
    # Guard against running untrusted PR code under pull_request_target (which
    # has access to secrets). Trusted authors (repo collaborators with write+)
    # are auto-allowed; external contributors need the `deploy-preview` label.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check author association or label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const assoc = context.payload.pull_request.author_association;
            if (trusted.includes(assoc)) {
              core.info(`Author association ${assoc} is trusted — proceeding.`);
              return;
            }
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (labels.includes('deploy-preview')) {
              core.info('deploy-preview label present — proceeding.');
              return;
            }
            core.setFailed(
              `PR from ${assoc} without deploy-preview label. ` +
              `Add the label manually after reviewing the PR to deploy.`,
            );

  wait-for-ci:
    # Only gate on CI for PRs — push to main/next and manual dispatch skip this.
    needs: [authorize]
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # `fountainhead/action-wait-for-check` only waits for a check to reach a
      # terminal state; it does NOT fail the step when that terminal state is
      # "failure" or "cancelled". We read `outputs.conclusion` and fail
      # explicitly whenever it's not "success" so deploy doesn't run on a red
      # CI.
      - name: Wait for CI build
        id: build
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: build
          ref: ${{ github.event.pull_request.head.sha }}
          timeoutSeconds: 3000
          intervalSeconds: 15

      - name: Assert CI build succeeded
        if: steps.build.outputs.conclusion != 'success'
        run: |
          echo "CI build concluded with '${{ steps.build.outputs.conclusion }}' — aborting deploy."
          exit 1

      - name: Wait for CI integration
        id: integration
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: integration
          ref: ${{ github.event.pull_request.head.sha }}
          timeoutSeconds: 3000
          intervalSeconds: 15

      - name: Assert CI integration succeeded
        if: steps.integration.outputs.conclusion != 'success'
        run: |
          echo "CI integration concluded with '${{ steps.integration.outputs.conclusion }}' — aborting deploy."
          exit 1

      - name: Wait for CI e2e
        id: e2e
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: e2e
          ref: ${{ github.event.pull_request.head.sha }}
          timeoutSeconds: 3600
          intervalSeconds: 15

      - name: Assert CI e2e succeeded
        if: steps.e2e.outputs.conclusion != 'success'
        run: |
          echo "CI e2e concluded with '${{ steps.e2e.outputs.conclusion }}' — aborting deploy."
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: [authorize, wait-for-ci]
    # On push and workflow_dispatch, authorize + wait-for-ci are both skipped
    # — allow deploy through. On PRs, require wait-for-ci to have succeeded
    # (which in turn requires authorize to have succeeded).
    if: ${{ always() && (needs.wait-for-ci.result == 'success' || (needs.wait-for-ci.result == 'skipped' && github.event_name != 'pull_request_target')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # pull_request_target defaults to the base ref — check out the PR head
          # so we deploy the actual proposed changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup
        with:
          # Used only when the PR-head branch is on the private channel (v5-next);
          # public branches' setup action ignores them.
          gcp-sa-key: ${{ secrets.GCP_SA_KEY_FILE }}
          gh-app-id: ${{ vars.GH_APP_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Strip `local.json` from every app's network list before anything
      # builds. The apps pick up whatever JSONs exist under config/networks/
      # at build time — removing local.json keeps developer-only networks
      # out of the deployed bundle.
      - name: Remove local network configs
        run: rm -f apps/*/src/config/networks/local.json

      - name: Build packages
        run: yarn build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pick the project-ID set and env slot based on which branch this run
      # targets. PRs pin to their `base.ref`; push/dispatch pin to `github.ref`.
      #
      # branch → project IDs:
      #   main         → BRIDGE_PROJECT_ID / FPC_PROJECT_ID / SWAP_PROJECT_ID
      #   next, v5-next → BRIDGE_PROJECT_ID_NEXT / FPC_PROJECT_ID_NEXT / SWAP_PROJECT_ID_NEXT
      #
      # event → slot:
      #   any event on v5-next          → preview (never production)
      #   pull_request_target           → preview
      #   push                          → production (of the branch's project)
      #   workflow_dispatch (prod=true) → production
      #   workflow_dispatch (prod=false)→ preview
      - name: Resolve project IDs and Vercel env slot
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            BRANCH="${{ github.event.pull_request.base.ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          case "$BRANCH" in
            main)
              echo "BRIDGE_PROJECT_ID_RESOLVED=${{ secrets.BRIDGE_PROJECT_ID }}" >> "$GITHUB_ENV"
              echo "FPC_PROJECT_ID_RESOLVED=${{ secrets.FPC_PROJECT_ID }}" >> "$GITHUB_ENV"
              echo "SWAP_PROJECT_ID_RESOLVED=${{ secrets.SWAP_PROJECT_ID }}" >> "$GITHUB_ENV"
              ;;
            next|v5-next)
              # v5-next reuses the *-next Vercel project but is pinned to the
              # PREVIEW slot below, so it never touches the next.* production domain.
              echo "BRIDGE_PROJECT_ID_RESOLVED=${{ secrets.BRIDGE_PROJECT_ID_NEXT }}" >> "$GITHUB_ENV"
              echo "FPC_PROJECT_ID_RESOLVED=${{ secrets.FPC_PROJECT_ID_NEXT }}" >> "$GITHUB_ENV"
              echo "SWAP_PROJECT_ID_RESOLVED=${{ secrets.SWAP_PROJECT_ID_NEXT }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported branch for deploy: $BRANCH"
              exit 1
              ;;
          esac

          if [ "$BRANCH" = "v5-next" ]; then
            # v5-next is preview-only — never a production (public) deploy,
            # regardless of event (only PRs targeting v5-next reach here).
            echo "VERCEL_ENV_SLOT=preview" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "VERCEL_ENV_SLOT=preview" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production }}" != "true" ]; then
            echo "VERCEL_ENV_SLOT=preview" >> "$GITHUB_ENV"
          else
            echo "VERCEL_ENV_SLOT=production" >> "$GITHUB_ENV"
          fi

      # ── Bridge deployment ──────────────────────────────────────────────
      - name: Pull Vercel Environment (Bridge)
        env:
          VERCEL_PROJECT_ID: ${{ env.BRIDGE_PROJECT_ID_RESOLVED }}
        run: vercel pull --yes --environment=$VERCEL_ENV_SLOT --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/bridge

      - name: Build and deploy Bridge
        id: deploy-bridge
        env:
          VERCEL_PROJECT_ID: ${{ env.BRIDGE_PROJECT_ID_RESOLVED }}
        run: |
          if [ "$VERCEL_ENV_SLOT" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/bridge
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/bridge)
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/bridge
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/bridge)
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # ── FPC Operator deployment ────────────────────────────────────────
      - name: Pull Vercel Environment (FPC Operator)
        env:
          VERCEL_PROJECT_ID: ${{ env.FPC_PROJECT_ID_RESOLVED }}
        run: vercel pull --yes --environment=$VERCEL_ENV_SLOT --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/fpc-operator

      - name: Build and deploy FPC Operator
        id: deploy-fpc
        env:
          VERCEL_PROJECT_ID: ${{ env.FPC_PROJECT_ID_RESOLVED }}
          VITE_BRIDGE_URL: ${{ vars.VITE_BRIDGE_URL }}
        run: |
          if [ "$VERCEL_ENV_SLOT" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/fpc-operator
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/fpc-operator)
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/fpc-operator
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/fpc-operator)
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # ── Swap deployment ────────────────────────────────────────────────
      - name: Pull Vercel Environment (Swap)
        env:
          VERCEL_PROJECT_ID: ${{ env.SWAP_PROJECT_ID_RESOLVED }}
        run: vercel pull --yes --environment=$VERCEL_ENV_SLOT --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/swap

      - name: Build and deploy Swap
        id: deploy-swap
        env:
          VERCEL_PROJECT_ID: ${{ env.SWAP_PROJECT_ID_RESOLVED }}
          VITE_WEB_WALLET_URL: ${{ vars.VITE_WEB_WALLET_URL }}
        run: |
          if [ "$VERCEL_ENV_SLOT" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/swap
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/swap)
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/swap
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/swap)
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # ── PR Comment ─────────────────────────────────────────────────────
      - name: Comment deployment URLs on PR
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = [
              '🚀 Deployed to Vercel!',
              '',
              '**Bridge:** ${{ steps.deploy-bridge.outputs.url }}',
              '**FPC Operator:** ${{ steps.deploy-fpc.outputs.url }}',
              '**Swap:** ${{ steps.deploy-swap.outputs.url }}',
            ].join('\n');

            // Update the existing bot comment in place if present, so PRs
            // don't accumulate one comment per push.
            const marker = '<!-- aztec-kit-deploy-urls -->';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fullBody,
              });
            }
