name: Deploy to Vercel

# ─────────────────────────────────────────────────────────────────────────────
# Two-project Vercel model
# ─────────────────────────────────────────────────────────────────────────────
# Each app has TWO Vercel projects, one per long-lived branch:
#   - `aztec-kit-<app>`      → production = main, preview = PRs against main
#   - `aztec-kit-<app>-next` → production = next, preview = PRs against next
#
# Per-app project IDs are stored as repo secrets:
#   BRIDGE_PROJECT_ID  / BRIDGE_PROJECT_ID_NEXT
#   FPC_PROJECT_ID     / FPC_PROJECT_ID_NEXT
#   SWAP_PROJECT_ID    / SWAP_PROJECT_ID_NEXT
#
# Production domains (next.<app>.aztec-labs.com) are configured on the *-next
# Vercel projects, so prod-slot deploys auto-alias — no manual `vercel alias
# set` step.
#
# SOURCE OF TRUTH = the DEFAULT branch (main). A `workflow_run` workflow always
# executes the default branch's copy regardless of which branch CI ran on, so
# main's version is the one that actually deploys; the copies on the long-lived
# branches are kept in sync (used there only for manual `workflow_dispatch`).
# The setup action is branch-aware: a PR head on the private channel (v5-next)
# triggers the private toolchain flow; public heads use install.aztec.network.
# v5-next routes to the *-next project's PREVIEW slot only (never the next.*
# production domain).
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Triggered when the CI workflow finishes. We read `workflow_run.conclusion`
  # directly rather than polling the PR's checks: a CI run that was cancelled
  # (e.g. superseded by `cancel-in-progress` when the base branch churns) simply
  # doesn't deploy, instead of tripping a poll-gate that treated `cancelled` as a
  # hard failure. Like pull_request_target, a workflow_run workflow ALWAYS runs
  # the DEFAULT branch's copy of this file with secrets — so it still gates
  # building untrusted PR code (see the `gate` job), and the file is still kept
  # replicated on the long-lived branches (used there for manual dispatch).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production (false → preview deploy on the dispatch ref's project)"
        required: false
        default: true
        type: boolean

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Decide whether (and what) to deploy from the CI run that just finished, or
    # a manual dispatch. Skips fast when CI didn't pass, so a failed/cancelled
    # CI run never produces a red deploy check — it just doesn't deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      slot: ${{ steps.decide.outputs.slot }}
      branch_key: ${{ steps.decide.outputs.branch_key }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: Decide target + authorize
        id: decide
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const out = (k, v) => core.setOutput(k, v);
            out('deploy', 'false');
            const skip = (msg) => core.info(`Not deploying: ${msg}`);

            // A long-lived branch → its Vercel project set. v5-next reuses the
            // *-next projects (pinned to the preview slot below).
            const branchKey = (b) =>
              b === 'main' ? 'main' : (b === 'next' || b === 'v5-next') ? 'next' : null;

            if (context.eventName === 'workflow_dispatch') {
              const branch = context.ref.replace('refs/heads/', '');
              const key = branchKey(branch);
              if (!key) return skip(`unsupported dispatch branch ${branch}`);
              out('head_sha', context.sha);
              out('branch_key', key);
              // v5-next is preview-only; otherwise honor the production input.
              const prod = branch !== 'v5-next' && context.payload.inputs.production !== 'false';
              out('slot', prod ? 'production' : 'preview');
              out('deploy', 'true');
              return;
            }

            const run = context.payload.workflow_run;
            out('head_sha', run.head_sha);

            if (run.event === 'push') {
              // main/next pushes deploy production. v5-next is preview-only
              // (deployed only from PRs), so a push to it does not deploy.
              if (run.head_branch === 'main' || run.head_branch === 'next') {
                out('branch_key', run.head_branch);
                out('slot', 'production');
                out('deploy', 'true');
              } else {
                skip(`push to ${run.head_branch} does not deploy`);
              }
              return;
            }

            if (run.event === 'pull_request') {
              // workflow_run carries associated PRs for same-repo heads; fall
              // back to a lookup by commit for fork heads.
              let pr = (run.pull_requests || [])[0];
              if (!pr) {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha,
                });
                pr = data.find((p) => p.state === 'open');
              }
              if (!pr) return skip('no open PR for this CI run');
              out('pr_number', String(pr.number));

              const { data: full } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
              });
              const key = branchKey(full.base.ref);
              if (!key) return skip(`PR base ${full.base.ref} not deployable`);

              // Guard building untrusted PR code with secrets: trusted author or
              // an explicit deploy-preview label.
              const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'];
              const labels = (full.labels || []).map((l) => l.name);
              if (!trusted.includes(full.author_association) && !labels.includes('deploy-preview')) {
                return skip(
                  `PR #${pr.number} from ${full.author_association} without deploy-preview label`,
                );
              }

              out('branch_key', key);
              out('slot', 'preview'); // PRs (including v5-next) always preview
              out('deploy', 'true');
              return;
            }

            skip(`CI event ${run.event} does not deploy`);

  deploy:
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.deploy == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Deploy the exact commit CI ran against (PR head / pushed commit /
          # dispatch ref) as resolved by the gate job.
          ref: ${{ needs.gate.outputs.head_sha }}

      - uses: ./.github/actions/setup
        with:
          # Used only when the PR-head branch is on the private channel (v5-next);
          # public branches' setup action ignores them.
          gcp-sa-key: ${{ secrets.GCP_SA_KEY_FILE }}
          gh-app-id: ${{ vars.GH_APP_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Strip `local.json` from every app's network list before anything
      # builds. The apps pick up whatever JSONs exist under config/networks/
      # at build time — removing local.json keeps developer-only networks
      # out of the deployed bundle.
      - name: Remove local network configs
        run: rm -f apps/*/src/config/networks/local.json

      - name: Build packages
        run: yarn build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The gate job already resolved the target branch set (`branch_key`:
      # main | next) and the slot (production | preview). Map branch_key to its
      # Vercel project-ID secrets.
      #
      #   main → BRIDGE_PROJECT_ID / FPC_PROJECT_ID / SWAP_PROJECT_ID
      #   next → BRIDGE_PROJECT_ID_NEXT / FPC_PROJECT_ID_NEXT / SWAP_PROJECT_ID_NEXT
      #          (backs both next [production slot] and v5-next [preview slot])
      - name: Resolve project IDs and Vercel env slot
        run: |
          case "${{ needs.gate.outputs.branch_key }}" in
            main)
              echo "BRIDGE_PROJECT_ID_RESOLVED=${{ secrets.BRIDGE_PROJECT_ID }}" >> "$GITHUB_ENV"
              echo "FPC_PROJECT_ID_RESOLVED=${{ secrets.FPC_PROJECT_ID }}" >> "$GITHUB_ENV"
              echo "SWAP_PROJECT_ID_RESOLVED=${{ secrets.SWAP_PROJECT_ID }}" >> "$GITHUB_ENV"
              ;;
            next)
              echo "BRIDGE_PROJECT_ID_RESOLVED=${{ secrets.BRIDGE_PROJECT_ID_NEXT }}" >> "$GITHUB_ENV"
              echo "FPC_PROJECT_ID_RESOLVED=${{ secrets.FPC_PROJECT_ID_NEXT }}" >> "$GITHUB_ENV"
              echo "SWAP_PROJECT_ID_RESOLVED=${{ secrets.SWAP_PROJECT_ID_NEXT }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unexpected branch_key '${{ needs.gate.outputs.branch_key }}'"
              exit 1
              ;;
          esac
          echo "VERCEL_ENV_SLOT=${{ needs.gate.outputs.slot }}" >> "$GITHUB_ENV"

      # ── Bridge deployment ──────────────────────────────────────────────
      - name: Pull Vercel Environment (Bridge)
        env:
          VERCEL_PROJECT_ID: ${{ env.BRIDGE_PROJECT_ID_RESOLVED }}
        run: vercel pull --yes --environment=$VERCEL_ENV_SLOT --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/bridge

      - name: Build and deploy Bridge
        id: deploy-bridge
        env:
          VERCEL_PROJECT_ID: ${{ env.BRIDGE_PROJECT_ID_RESOLVED }}
          # Build-time auth key for the gateway-fronted staging node; resolved
          # into the staging.json `${VITE_STAGING_API_KEY}` placeholder by Vite.
          VITE_STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          if [ "$VERCEL_ENV_SLOT" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/bridge
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/bridge)
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/bridge
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/bridge)
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # ── FPC Operator deployment ────────────────────────────────────────
      - name: Pull Vercel Environment (FPC Operator)
        env:
          VERCEL_PROJECT_ID: ${{ env.FPC_PROJECT_ID_RESOLVED }}
        run: vercel pull --yes --environment=$VERCEL_ENV_SLOT --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/fpc-operator

      - name: Build and deploy FPC Operator
        id: deploy-fpc
        env:
          VERCEL_PROJECT_ID: ${{ env.FPC_PROJECT_ID_RESOLVED }}
          VITE_BRIDGE_URL: ${{ vars.VITE_BRIDGE_URL }}
          VITE_STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          if [ "$VERCEL_ENV_SLOT" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/fpc-operator
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/fpc-operator)
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/fpc-operator
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/fpc-operator)
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # ── Swap deployment ────────────────────────────────────────────────
      - name: Pull Vercel Environment (Swap)
        env:
          VERCEL_PROJECT_ID: ${{ env.SWAP_PROJECT_ID_RESOLVED }}
        run: vercel pull --yes --environment=$VERCEL_ENV_SLOT --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/swap

      - name: Build and deploy Swap
        id: deploy-swap
        env:
          VERCEL_PROJECT_ID: ${{ env.SWAP_PROJECT_ID_RESOLVED }}
          VITE_WEB_WALLET_URL: ${{ vars.VITE_WEB_WALLET_URL }}
          VITE_STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          if [ "$VERCEL_ENV_SLOT" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/swap
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/swap)
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/swap
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes --cwd apps/swap)
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      # ── PR Comment ─────────────────────────────────────────────────────
      - name: Comment deployment URLs on PR
        if: needs.gate.outputs.pr_number != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = ${{ needs.gate.outputs.pr_number }};
            const body = [
              '🚀 Deployed to Vercel!',
              '',
              '**Bridge:** ${{ steps.deploy-bridge.outputs.url }}',
              '**FPC Operator:** ${{ steps.deploy-fpc.outputs.url }}',
              '**Swap:** ${{ steps.deploy-swap.outputs.url }}',
            ].join('\n');

            // Update the existing bot comment in place if present, so PRs
            // don't accumulate one comment per push.
            const marker = '<!-- aztec-kit-deploy-urls -->';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fullBody,
              });
            }
