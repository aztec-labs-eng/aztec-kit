name: Setup workspace
description: >
  Install Node + corepack, restore cached yarn + aztec deps, install what's
  missing, compile contract artifacts, and extend PATH with the aztec CLI.
  Every job that needs a ready-to-use monorepo starts with this action.

inputs:
  cache-suffix:
    description: >
      Optional suffix appended to toolchain-sensitive cache keys (yarn +
      turbo). Set this when the job runs in a container with a different
      libc/toolchain than the default host runner — otherwise native addons
      in cached node_modules can cross-contaminate between jobs.
    required: false
    default: ""
  gcp-sa-key:
    description: >
      GCP service-account JSON key with read access to the private @aztec
      Artifact Registry (us-west1-npm.pkg.dev/testnet-440309/aztec-npm).
    required: true
  gh-app-id:
    description: >
      GitHub App ID whose installation can read AztecProtocol/aztec-packages-private.
      nargo clones the aztec-nr Noir source from there, and the toolchain reads
      the noir/foundry version pins from it.
    required: true
  gh-app-private-key:
    description: Private key (PEM) matching gh-app-id.
    required: true

outputs:
  aztec-version:
    description: Aztec version string extracted from apps/bridge/package.json.
    value: ${{ steps.aztec-version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    # Installation token for the private monorepo (different org than this repo,
    # hence explicit owner). Scoped read-only to aztec-packages-private.
    - name: Mint token for the private repo (aztec-nr source)
      id: app-token
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.gh-app-id }}
        private-key: ${{ inputs.gh-app-private-key }}
        owner: AztecProtocol
        repositories: aztec-packages-private

    # Mint the private @aztec Artifact Registry token from the service-account
    # key via gcloud (scripts/registry-token.sh — a direct JWT→OAuth exchange
    # that needs no extra IAM, unlike google-github-actions/auth's access_token
    # path). gcloud is preinstalled on ubuntu-latest. .yarnrc.yml reads the
    # token as ${AZTEC_NPM_TOKEN}, so yarn install + the toolchain authenticate.
    - name: Registry token + private-git auth
      shell: bash
      env:
        GCP_SA_KEY: ${{ inputs.gcp-sa-key }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        KEY="$RUNNER_TEMP/gcp-sa.json"
        printf '%s' "$GCP_SA_KEY" > "$KEY"
        TOKEN="$(GCP_SA_KEY_FILE="$KEY" bash scripts/registry-token.sh)"
        rm -f "$KEY"
        echo "::add-mask::$TOKEN"
        echo "AZTEC_NPM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        # nargo clones the private monorepo (aztec-nr source) over https; let it
        # use the app token. Source only — contract artifacts are compiled here.
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

    # Cache the yarn download store, install state, and every `node_modules`
    # tree across the workspace. Keyed on yarn.lock so any dependency bump
    # busts the cache automatically.
    - name: Restore yarn + node_modules cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .yarn/cache
          .yarn/install-state.gz
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/contracts/*/node_modules
          e2e/node_modules
        key: yarn-v2-${{ runner.os }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-v2-${{ runner.os }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Extract Aztec version
      id: aztec-version
      shell: bash
      run: |
        VERSION=$(jq -r '.dependencies["@aztec/aztec.js"]' apps/bridge/package.json)
        VERSION_NO_V=${VERSION#v}
        echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT

    # Cache the full Aztec CLI install tree. The installer lays down files
    # into multiple locations (~/.aztec/bin symlinks, ~/.aztec/versions/<v>/
    # with bin/ + node_modules/, plus a version-pin config). Cache the whole
    # ~/.aztec tree to avoid re-running the installer.
    #
    # `foundry` (anvil) is also installed by the script into ~/.foundry/bin
    # during local-network spin-up. Cache that too so integration tests can
    # find `anvil` after a cache hit.
    - name: Cache Aztec + Foundry
      id: aztec-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.aztec
          ~/.foundry
        key: aztec-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}

    # Private nightlies aren't on install.aztec.network / public npm, so we
    # assemble the toolchain ourselves: nargo from the public noir release,
    # bb + CLI from the private registry, foundry from foundryup. See the script.
    - name: Install Aztec toolchain (private)
      if: steps.aztec-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        # derive_versions reads the private repo (noir pin + foundry version) via the API;
        # AZTEC_NPM_TOKEN is already in $GITHUB_ENV from the auth step.
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: bash scripts/install-private-toolchain.sh

    - name: Update PATH
      shell: bash
      run: |
        # `bin/` holds user-facing aztec-* symlinks; `node_modules/.bin/` holds
        # JS CLIs. Native tools (nargo, forge, cast, anvil, chisel, noir-profiler)
        # live in `internal-bin/` since v4.3.0-nightly.20260512-1 — the upstream
        # installer no longer puts them on PATH (the shell-wrapper `aztec`
        # prepends internal-bin to its child env, but the npm-shipped
        # `node_modules/.bin/aztec` doesn't, so we add it ourselves).
        echo "$HOME/.aztec/versions/${{ steps.aztec-version.outputs.version }}/bin" >> $GITHUB_PATH
        echo "$HOME/.aztec/versions/${{ steps.aztec-version.outputs.version }}/internal-bin" >> $GITHUB_PATH
        echo "$HOME/.aztec/versions/${{ steps.aztec-version.outputs.version }}/node_modules/.bin" >> $GITHUB_PATH
        echo "$HOME/.foundry/bin" >> $GITHUB_PATH

    # Turbo's local cache + build outputs. Single source of truth for ALL
    # compiled artifacts in any given run: `dist/`, `noir/target/`,
    # `noir/artifacts/`, the ethereum codegen, etc. — every output `turbo.json`
    # lists for the `build` task lives here.
    #
    # An earlier version had a second cache that stored just `noir/target` +
    # `noir/artifacts` keyed on the noir-source hash, and a conditional
    # pre-build compile step that primed it. That created two independent
    # writers for the same files: when the contracts cache hit but the turbo
    # cache fell back to a different (older) `restore-keys` prefix entry,
    # the e2e job ended up with `noir/target/*.json` from one compile and
    # `dist/noir/target/*.json` from a different compile. Class-id mismatch
    # at signup time (PXE rejects the artifact). Folding everything into
    # turbo's per-SHA cache keeps the two paths in lockstep.
    #
    # Not suffixed with `cache-suffix`: emitted artifacts are platform-
    # independent, so any job can read what another wrote under the same SHA.
    # The aztec-version is part of the key prefix so that on a version bump
    # the `restore-keys` fallback doesn't drag in the previous version's
    # `dist/` while `noir/target/` recompiles to the new version's output.
    - name: Cache turbo outputs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .turbo
          apps/*/.turbo
          packages/*/.turbo
          packages/contracts/*/.turbo
          e2e/.turbo
          apps/*/dist
          packages/*/dist
          packages/contracts/*/dist
          packages/contracts/aztec/noir/target
          packages/contracts/aztec/noir/artifacts
          packages/contracts/ethereum/generated
          packages/contracts/ethereum/solidity/out
        key: turbo-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}-
