name: Setup workspace
description: >
  Install Node + corepack, restore cached yarn + aztec deps, install what's
  missing, and extend PATH with the aztec CLI. Branch-aware: a branch whose
  .yarnrc.yml points @aztec at the private Artifact Registry uses the private
  toolchain flow (gcloud-minted token + GitHub App for aztec-nr + local
  toolchain assembly); any other branch uses the public install.aztec.network
  flow. This single action is the SOURCE OF TRUTH on the default branch and is
  replicated to the long-lived branches.

inputs:
  cache-suffix:
    description: >
      Optional suffix appended to toolchain-sensitive cache keys (yarn +
      turbo). Set this when the job runs in a container with a different
      libc/toolchain than the default host runner — otherwise native addons
      in cached node_modules can cross-contaminate between jobs.
    required: false
    default: ""
  # The following are ONLY needed by branches on the private @aztec release
  # channel (detected below). Public branches (main/next) ignore them.
  gcp-sa-key:
    description: GCP service-account JSON key for the private @aztec Artifact Registry.
    required: false
    default: ""
  gh-app-id:
    description: GitHub App ID able to read AztecProtocol/aztec-packages-private (aztec-nr source).
    required: false
    default: ""
  gh-app-private-key:
    description: Private key (PEM) matching gh-app-id.
    required: false
    default: ""

outputs:
  aztec-version:
    description: Aztec version string extracted from apps/bridge/package.json.
    value: ${{ steps.aztec-version.outputs.version }}
  private-channel:
    description: "'true' when this branch consumes the private @aztec release channel."
    value: ${{ steps.channel.outputs.private }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    # Single switch for the whole action: does this branch pull @aztec from the
    # private registry? Detected from the committed .yarnrc.yml so it needs no
    # input and travels with the branch.
    - name: Detect release channel
      id: channel
      shell: bash
      run: |
        if grep -qF 'us-west1-npm.pkg.dev' .yarnrc.yml 2>/dev/null; then
          echo "private=true" >> "$GITHUB_OUTPUT"
          echo "Release channel: PRIVATE (Artifact Registry)"
        else
          echo "private=false" >> "$GITHUB_OUTPUT"
          echo "Release channel: PUBLIC (npm + install.aztec.network)"
        fi

    # ── private channel only: auth ──────────────────────────────────────────
    - name: Mint token for the private repo (aztec-nr source)
      if: steps.channel.outputs.private == 'true'
      id: app-token
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.gh-app-id }}
        private-key: ${{ inputs.gh-app-private-key }}
        owner: AztecProtocol
        repositories: aztec-packages-private

    - name: Private registry token + git auth
      if: steps.channel.outputs.private == 'true'
      shell: bash
      env:
        GCP_SA_KEY: ${{ inputs.gcp-sa-key }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        # Mint the registry token via gcloud (direct JWT→OAuth, no IAM
        # serviceAccountTokenCreator needed). .yarnrc.yml reads ${AZTEC_NPM_TOKEN}.
        KEY="$RUNNER_TEMP/gcp-sa.json"
        printf '%s' "$GCP_SA_KEY" > "$KEY"
        TOKEN="$(GCP_SA_KEY_FILE="$KEY" bash scripts/registry-token.sh)"
        rm -f "$KEY"
        echo "::add-mask::$TOKEN"
        echo "AZTEC_NPM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        # nargo clones the private monorepo (aztec-nr source) over https.
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

    # ── common: workspace install ─────────────────────────────────────────────
    - name: Restore yarn + node_modules cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .yarn/cache
          .yarn/install-state.gz
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/contracts/*/node_modules
          e2e/node_modules
        key: yarn-v2-${{ runner.os }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-v2-${{ runner.os }}${{ inputs.cache-suffix && format('-{0}', inputs.cache-suffix) }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Extract Aztec version
      id: aztec-version
      shell: bash
      run: |
        VERSION=$(jq -r '.dependencies["@aztec/aztec.js"]' apps/bridge/package.json)
        echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

    # ── toolchain (cached across runs by version) ─────────────────────────────
    - name: Cache Aztec + Foundry
      id: aztec-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.aztec
          ~/.foundry
        key: aztec-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}

    # Private nightlies aren't on install.aztec.network / public npm — assemble
    # the toolchain locally (public-noir nargo + private-registry bb/CLI).
    - name: Install Aztec toolchain (private)
      if: steps.channel.outputs.private == 'true' && steps.aztec-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: bash scripts/install-private-toolchain.sh

    - name: Install Aztec toolchain (public)
      if: steps.channel.outputs.private != 'true' && steps.aztec-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export CI=1
        export FOUNDRY_DIR="$HOME/.foundry"
        curl -fsSL "https://install.aztec.network/${{ steps.aztec-version.outputs.version }}/install" | VERSION="${{ steps.aztec-version.outputs.version }}" bash

    - name: Update PATH
      shell: bash
      run: |
        # `bin/` holds user-facing aztec-* symlinks; native tools live in
        # `internal-bin/`; JS CLIs in `node_modules/.bin/`. Add all three + foundry.
        V="${{ steps.aztec-version.outputs.version }}"
        echo "$HOME/.aztec/versions/$V/bin" >> "$GITHUB_PATH"
        echo "$HOME/.aztec/versions/$V/internal-bin" >> "$GITHUB_PATH"
        echo "$HOME/.aztec/versions/$V/node_modules/.bin" >> "$GITHUB_PATH"
        echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

    # Turbo's local cache + every build output (single source of truth per SHA).
    - name: Cache turbo outputs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .turbo
          apps/*/.turbo
          packages/*/.turbo
          packages/contracts/*/.turbo
          e2e/.turbo
          apps/*/dist
          packages/*/dist
          packages/contracts/*/dist
          packages/contracts/aztec/noir/target
          packages/contracts/aztec/noir/artifacts
          packages/contracts/ethereum/generated
          packages/contracts/ethereum/solidity/out
        key: turbo-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ steps.aztec-version.outputs.version }}-
