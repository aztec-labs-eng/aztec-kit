nodeLinker: node-modules

# @aztec/* packages are pulled from the private Google Artifact Registry
# (GKE, project testnet-440309). The auth token is a short-lived gcloud
# access token supplied via the AZTEC_NPM_TOKEN env var so no secret is
# committed. Refresh it with:
#   export AZTEC_NPM_TOKEN=$(gcloud auth print-access-token)
npmScopes:
  aztec:
    npmRegistryServer: "https://us-west1-npm.pkg.dev/testnet-440309/aztec-npm"
    npmAlwaysAuth: true
    npmAuthToken: "${AZTEC_NPM_TOKEN:-}"
